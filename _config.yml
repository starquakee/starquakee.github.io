# Basic Site Settings
locale                   : "en-US"
title                    : "Chenchen Feng"
title_separator          : "-"
name                     : &name "Chenchen Feng"
description              : &description "A graduate student specializing in Evolutionary Computation"
url                      : https://starquakee.github.io
baseurl                  : ""
repository               : "starquakee/starquakee.github.io"

# Sidebar profile
author:
  avatar           : "photo.jpg"
  name             : "Chenchen Feng"
  bio              : "Studying..."
  location         : "Shenzhen, China"
  employer         : "SUSTech"
  email            : "chenchenfengcn@gmail.com"
  supervisor       : "bjeIdlcAAAAJ"
  orcid            : "https://orcid.org/0009-0000-1072-8183"
  leetcode         : "https://leetcode.cn/u/star-quake/"
  github           : "starquakee"

# Publication headings
publication_category:
  manuscripts:
    title: 'Journal Articles'

# Site Settings
breadcrumbs              : false # true, false (default)
words_per_minute         : 160
future                   : false
read_more                : "disabled"
atom_feed:
  hide                   : false
  path                   :


# Reading Files
include:
  - _pages
  - files
exclude:
  - AGENTS.md
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


collections:
  publications:
    output: true
    permalink: /:collection/:path/


defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: false
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed


# Outputting
permalink: /:categories/:title/
timezone: Asia/Shanghai


# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from


tag_archive:
  type: liquid
  path: /tags/


compress_html:
  clippings: all
  ignore:
    envs: development
